version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MedManager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MedManager || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=MedManager;Username=postgres;Password=postgres
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=MedManager
      # JWT Settings
      - Jwt__Key=YourSuperSecretKeyThatMustBeAtLeast32CharactersLongForSecurity!
      - Jwt__Issuer=MedManagerApi
      - Jwt__Audience=MedManagerApiClients
      - Jwt__ExpiryMinutes=60
      # Email Settings (Update with your SMTP credentials)
      - EmailSettings__FromEmail=noreply@medmanager.com
      - EmailSettings__FromName=MedManager
      - EmailSettings__SmtpHost=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__SmtpUser=your-email@gmail.com
      - EmailSettings__SmtpPassword=your-app-password
      - EmailSettings__EnableSsl=true
    ports:
      - "5042:80"
    restart: unless-stopped

volumes:
  pgdata:
